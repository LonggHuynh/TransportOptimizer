name: Deploy - Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        type: choice
        options:
          - stage
          - prod
        required: true
      tfc_organization:
        description: "HCP Terraform/Terraform Enterprise organization"
        required: false
        default: LongHuynhh
      tfc_hostname:
        description: "HCP Terraform/Terraform Enterprise hostname"
        required: false
        default: app.terraform.io
  push:
    branches:
      - stage
      - prod
    paths:
      - "frontend/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

jobs:
  resolve-target-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            target_environment="${GITHUB_REF_NAME}"
          else
            target_environment="${{ inputs.environment }}"
          fi

          if [[ ! "${target_environment}" =~ ^(stage|prod)$ ]]; then
            echo "Invalid target environment: ${target_environment}"
            exit 1
          fi

          echo "target_environment=${target_environment}" >> "${GITHUB_OUTPUT}"

  build-and-push-frontend:
    name: Build and Push Frontend Docker Image to GHCR
    needs: resolve-target-environment
    uses: ./.github/workflows/deploy-container-build.yml
    with:
      context: ./frontend
      dockerfile: ./frontend/Dockerfile
      image_suffix: frontend
      target_environment: ${{ needs.resolve-target-environment.outputs.target_environment }}

  deploy-frontend:
    name: Deploy frontend to target environment
    needs:
      - resolve-target-environment
      - build-and-push-frontend
    uses: ./.github/workflows/deploy-terraform-app-release.yml
    with:
      environment: ${{ needs.resolve-target-environment.outputs.target_environment }}
      frontend_tag: ${{ format('sha-{0}', github.sha) }}
      pull_policy: IfNotPresent
      tfc_organization: ${{ github.event.inputs.tfc_organization || 'LongHuynhh' }}
      tfc_hostname: ${{ github.event.inputs.tfc_hostname || 'app.terraform.io' }}
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

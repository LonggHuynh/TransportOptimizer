name: Worker Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - stage
      - prod
    paths:
      - "worker/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-worker:
    name: Build and Push Worker Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v4
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: |
            ghcr.io/longghuynh/transport-worker:latest
            ghcr.io/longghuynh/transport-worker:sha-${{ github.sha }}

name: Worker Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        type: choice
        options:
          - stage
          - prod
        required: true
      tfc_organization:
        description: "HCP Terraform/Terraform Enterprise organization"
        required: false
        default: LongHuynhh
      tfc_hostname:
        description: "HCP Terraform/Terraform Enterprise hostname"
        required: false
        default: app.terraform.io
  push:
    branches:
      - stage
      - prod
    paths:
      - "worker/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

jobs:
  resolve-target-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            target_environment="${GITHUB_REF_NAME}"
          else
            target_environment="${{ inputs.environment }}"
          fi

          if [[ ! "${target_environment}" =~ ^(stage|prod)$ ]]; then
            echo "Invalid target environment: ${target_environment}"
            exit 1
          fi

          echo "target_environment=${target_environment}" >> "${GITHUB_OUTPUT}"

  unit-tests-worker:
    name: Run worker unit tests
    runs-on: ubuntu-latest
    needs: resolve-target-environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install worker dependencies
        run: cd worker && pipenv install --deploy

      - name: Run worker unit tests
        run: cd worker && pipenv run python -m unittest discover -s tests -t . -p 'test_*.py'

  build-and-push-worker:
    name: Build and Push Worker Docker Image to GHCR
    needs:
      - resolve-target-environment
      - unit-tests-worker
    uses: ./.github/workflows/container-build-push.yml
    with:
      context: ./worker
      dockerfile: ./worker/Dockerfile
      image_suffix: worker
      target_environment: ${{ needs.resolve-target-environment.outputs.target_environment }}

  deploy-worker:
    name: Deploy worker to target environment
    needs:
      - resolve-target-environment
      - build-and-push-worker
    uses: ./.github/workflows/terraform-app-release.yml
    with:
      environment: ${{ needs.resolve-target-environment.outputs.target_environment }}
      worker_tag: ${{ format('sha-{0}', github.sha) }}
      pull_policy: IfNotPresent
      tfc_organization: ${{ github.event.inputs.tfc_organization || 'LongHuynhh' }}
      tfc_hostname: ${{ github.event.inputs.tfc_hostname || 'app.terraform.io' }}
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

name: CI - PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "backend/**"
      - "frontend/**"
      - "worker/**"
      - ".github/workflows/ci-pr.yml"
      - ".github/workflows/ci-service-unit-tests.yml"

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-service-unit-tests.yml
    with:
      service: backend

  frontend-build:
    name: Frontend Build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

  worker-unit-tests:
    name: Worker Unit Tests
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-service-unit-tests.yml
    with:
      service: worker

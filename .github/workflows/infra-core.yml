name: Infra Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        type: choice
        options:
          - common
          - stage
          - prod
        required: true

permissions:
  contents: read

concurrency:
  group: infra-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve-target-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        shell: bash
        run: |
          target_environment="${{ inputs.environment }}"

          if [[ ! "${target_environment}" =~ ^(common|stage|prod)$ ]]; then
            echo "Invalid target environment: ${target_environment}"
            exit 1
          fi

          echo "target_environment=${target_environment}" >> "${GITHUB_OUTPUT}"

  deploy-infra:
    name: Run manual Terraform apply
    needs: resolve-target-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target-environment.outputs.target_environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TARGET_ENV: ${{ needs.resolve-target-environment.outputs.target_environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        shell: bash
        run: |
          if [[ "${TARGET_ENV}" == "common" ]]; then
            terraform -chdir=infra/common init
          else
            terraform -chdir=infra/env init
            terraform -chdir=infra/env workspace select "${TARGET_ENV}" || terraform -chdir=infra/env workspace new "${TARGET_ENV}"
          fi

      - name: Terraform plan
        shell: bash
        run: |
          if [[ "${TARGET_ENV}" == "common" ]]; then
            terraform -chdir=infra/common plan -out=tfplan
          else
            terraform -chdir=infra/env plan -var-file="environments/${TARGET_ENV}.tfvars" -out=tfplan
          fi

      - name: Terraform apply
        shell: bash
        run: |
          if [[ "${TARGET_ENV}" == "common" ]]; then
            terraform -chdir=infra/common apply tfplan
          else
            terraform -chdir=infra/env apply tfplan
          fi

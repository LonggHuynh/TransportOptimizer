name: Infra Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment/workspace scope"
        type: choice
        options:
          - common
          - stage
          - prod
          - all
        required: true
      tfc_organization:
        description: "HCP Terraform/Terraform Enterprise organization"
        required: false
        default: LongHuynhh
      tfc_hostname:
        description: "HCP Terraform/Terraform Enterprise hostname"
        required: false
        default: app.terraform.io

permissions:
  contents: read

concurrency:
  group: infra-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve_target_environment:
    name: Resolve deployment scope
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
      deploy_common: ${{ steps.resolve.outputs.deploy_common }}
      env_matrix: ${{ steps.resolve.outputs.env_matrix }}
      tfc_organization: ${{ steps.resolve.outputs.tfc_organization }}
      tfc_hostname: ${{ steps.resolve.outputs.tfc_hostname }}
    steps:
      - name: Resolve target environment
        id: resolve
        shell: bash
        run: |
          target_environment="${{ inputs.environment }}"
          tfc_organization="${{ inputs.tfc_organization }}"
          tfc_hostname="${{ inputs.tfc_hostname }}"

          if [[ ! "${target_environment}" =~ ^(common|stage|prod|all)$ ]]; then
            echo "Invalid target environment: ${target_environment}"
            exit 1
          fi

          if [[ -z "${tfc_organization}" || ! "${tfc_organization}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid tfc_organization value: ${tfc_organization}"
            exit 1
          fi

          if [[ -z "${tfc_hostname}" || ! "${tfc_hostname}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "Invalid tfc_hostname value: ${tfc_hostname}"
            exit 1
          fi

          case "${target_environment}" in
            common)
              deploy_common=true
              env_matrix='[]'
              ;;
            stage)
              deploy_common=false
              env_matrix='[{"environment":"stage"}]'
              ;;
            prod)
              deploy_common=false
              env_matrix='[{"environment":"prod"}]'
              ;;
            all)
              deploy_common=true
              env_matrix='[{"environment":"stage"},{"environment":"prod"}]'
              ;;
          esac

          echo "target_environment=${target_environment}" >> "${GITHUB_OUTPUT}"
          echo "deploy_common=${deploy_common}" >> "${GITHUB_OUTPUT}"
          echo "env_matrix=${env_matrix}" >> "${GITHUB_OUTPUT}"
          echo "tfc_organization=${tfc_organization}" >> "${GITHUB_OUTPUT}"
          echo "tfc_hostname=${tfc_hostname}" >> "${GITHUB_OUTPUT}"

  deploy_common:
    name: Apply infra/common (transport-common)
    needs: resolve_target_environment
    if: ${{ needs.resolve_target_environment.outputs.deploy_common == 'true' }}
    runs-on: ubuntu-latest
    environment: common
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TFC_ORGANIZATION: ${{ needs.resolve_target_environment.outputs.tfc_organization }}
      TFC_HOSTNAME: ${{ needs.resolve_target_environment.outputs.tfc_hostname }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform credentials
        shell: bash
        run: |
          mkdir -p "${HOME}/.terraform.d"
          cat > "${HOME}/.terraform.d/credentials.tfrc.json" <<EOF
          {
            "credentials": {
              "${TFC_HOSTNAME}": {
                "token": "${TF_API_TOKEN}"
              }
            }
          }
          EOF

      - name: Terraform init (common)
        shell: bash
        run: terraform -chdir=infra/common init -input=false

      - name: Terraform plan (common)
        shell: bash
        run: terraform -chdir=infra/common plan

      - name: Terraform apply (common)
        shell: bash
        run: terraform -chdir=infra/common apply -auto-approve

  deploy_env_workspaces:
    name: Apply infra/env (${{ matrix.environment }})
    needs:
      - resolve_target_environment
      - deploy_common
    if: ${{ always() && needs.resolve_target_environment.outputs.env_matrix != '[]' && (needs.deploy_common.result == 'success' || needs.deploy_common.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.resolve_target_environment.outputs.env_matrix) }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TARGET_ENV: ${{ matrix.environment }}
      TF_WORKSPACE: ${{ matrix.environment }}
      TFC_ORGANIZATION: ${{ needs.resolve_target_environment.outputs.tfc_organization }}
      TFC_HOSTNAME: ${{ needs.resolve_target_environment.outputs.tfc_hostname }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform credentials
        shell: bash
        run: |
          mkdir -p "${HOME}/.terraform.d"
          cat > "${HOME}/.terraform.d/credentials.tfrc.json" <<EOF
          {
            "credentials": {
              "${TFC_HOSTNAME}": {
                "token": "${TF_API_TOKEN}"
              }
            }
          }
          EOF

      - name: Preselect Terraform workspace
        shell: bash
        run: |
          mkdir -p infra/env/.terraform
          printf '%s' "${TARGET_ENV}" > infra/env/.terraform/environment

      - name: Terraform init (env)
        shell: bash
        run: terraform -chdir=infra/env init -reconfigure -input=false -backend-config="organization=${TFC_ORGANIZATION}" -backend-config="hostname=${TFC_HOSTNAME}"

      - name: Prepare Terraform variable file (env)
        shell: bash
        run: cp "infra/env/environments/${TARGET_ENV}.tfvars" "infra/env/${TARGET_ENV}.auto.tfvars"

      - name: Terraform plan (env)
        shell: bash
        run: terraform -chdir=infra/env plan

      - name: Terraform apply (env)
        shell: bash
        run: terraform -chdir=infra/env apply -auto-approve

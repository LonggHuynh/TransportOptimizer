name: Infra Core Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        type: choice
        options:
          - stage
          - prod
        required: true

permissions:
  contents: read

concurrency:
  group: infra-core-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve-target-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        shell: bash
        run: |
          target_environment="${{ inputs.environment }}"

          if [[ ! "${target_environment}" =~ ^(stage|prod)$ ]]; then
            echo "Invalid target environment: ${target_environment}"
            exit 1
          fi

          echo "target_environment=${target_environment}" >> "${GITHUB_OUTPUT}"

  deploy-infra-core:
    name: Run manual Terraform apply
    needs: resolve-target-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target-environment.outputs.target_environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TARGET_ENV: ${{ needs.resolve-target-environment.outputs.target_environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Terraform plan
        run: |
          # Keep app image tags deterministic during full infra applies.
          export TF_VAR_backend_image_tag_by_env="{\"stage\":\"stage-latest\",\"prod\":\"prod-latest\"}"
          export TF_VAR_worker_image_tag_by_env="{\"stage\":\"stage-latest\",\"prod\":\"prod-latest\"}"
          export TF_VAR_image_pull_policy_by_env="{\"stage\":\"IfNotPresent\",\"prod\":\"IfNotPresent\"}"

          terraform -chdir=infra plan -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=infra apply tfplan

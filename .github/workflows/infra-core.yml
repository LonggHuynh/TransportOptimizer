name: Infra Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment/workspace scope"
        type: choice
        options:
          - common
          - stage
          - prod
          - all
        required: true

permissions:
  contents: read

concurrency:
  group: infra-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve_target_environment:
    name: Resolve deployment scope
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
      deploy_common: ${{ steps.resolve.outputs.deploy_common }}
      env_matrix: ${{ steps.resolve.outputs.env_matrix }}
    steps:
      - name: Resolve target environment
        id: resolve
        shell: bash
        run: |
          target_environment="${{ inputs.environment }}"

          if [[ ! "${target_environment}" =~ ^(common|stage|prod|all)$ ]]; then
            echo "Invalid target environment: ${target_environment}"
            exit 1
          fi

          case "${target_environment}" in
            common)
              deploy_common=true
              env_matrix='[]'
              ;;
            stage)
              deploy_common=false
              env_matrix='[{"environment":"stage"}]'
              ;;
            prod)
              deploy_common=false
              env_matrix='[{"environment":"prod"}]'
              ;;
            all)
              deploy_common=true
              env_matrix='[{"environment":"stage"},{"environment":"prod"}]'
              ;;
          esac

          echo "target_environment=${target_environment}" >> "${GITHUB_OUTPUT}"
          echo "deploy_common=${deploy_common}" >> "${GITHUB_OUTPUT}"
          echo "env_matrix=${env_matrix}" >> "${GITHUB_OUTPUT}"

  deploy_common:
    name: Apply infra/common (transport-common)
    needs: resolve_target_environment
    if: ${{ needs.resolve_target_environment.outputs.deploy_common == 'true' }}
    runs-on: ubuntu-latest
    environment: common
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (common)
        shell: bash
        run: terraform -chdir=infra/common init

      - name: Terraform plan (common)
        shell: bash
        run: terraform -chdir=infra/common plan

      - name: Terraform apply (common)
        shell: bash
        run: terraform -chdir=infra/common apply -auto-approve

  deploy_env_workspaces:
    name: Apply infra/env (${{ matrix.environment }})
    needs:
      - resolve_target_environment
      - deploy_common
    if: ${{ always() && needs.resolve_target_environment.outputs.env_matrix != '[]' && (needs.deploy_common.result == 'success' || needs.deploy_common.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.resolve_target_environment.outputs.env_matrix) }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TARGET_ENV: ${{ matrix.environment }}
      TF_WORKSPACE: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Preselect Terraform workspace
        shell: bash
        run: |
          mkdir -p infra/env/.terraform
          printf '%s' "${TARGET_ENV}" > infra/env/.terraform/environment

      - name: Terraform init (env)
        shell: bash
        run: terraform -chdir=infra/env init -reconfigure -input=false

      - name: Prepare Terraform variable file (env)
        shell: bash
        run: cp "infra/env/environments/${TARGET_ENV}.tfvars" "infra/env/${TARGET_ENV}.auto.tfvars"

      - name: Terraform plan (env)
        shell: bash
        run: terraform -chdir=infra/env plan

      - name: Terraform apply (env)
        shell: bash
        run: terraform -chdir=infra/env apply -auto-approve

name: Terraform App Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - stage
          - prod
        required: true
      backend_tag:
        description: "Backend image tag override (optional, for example sha-abcdef1234)"
        required: false
      worker_tag:
        description: "Worker image tag override (optional, for example sha-abcdef1234)"
        required: false
      frontend_tag:
        description: "Frontend image tag override (optional, for example sha-abcdef1234)"
        required: false
      pull_policy:
        description: "Kubernetes image pull policy"
        type: choice
        options:
          - IfNotPresent
          - Always
          - Never
        default: IfNotPresent
        required: true
      tfc_organization:
        description: "HCP Terraform/Terraform Enterprise organization"
        required: false
        default: LongHuynhh
      tfc_hostname:
        description: "HCP Terraform/Terraform Enterprise hostname"
        required: false
        default: app.terraform.io
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        type: string
        required: true
      backend_tag:
        description: "Backend image tag override (optional, for example sha-abcdef1234)"
        type: string
        required: false
        default: ""
      worker_tag:
        description: "Worker image tag override (optional, for example sha-abcdef1234)"
        type: string
        required: false
        default: ""
      frontend_tag:
        description: "Frontend image tag override (optional, for example sha-abcdef1234)"
        type: string
        required: false
        default: ""
      pull_policy:
        description: "Kubernetes image pull policy"
        type: string
        required: false
        default: IfNotPresent
      tfc_organization:
        description: "HCP Terraform/Terraform Enterprise organization"
        type: string
        required: false
        default: LongHuynhh
      tfc_hostname:
        description: "HCP Terraform/Terraform Enterprise hostname"
        type: string
        required: false
        default: app.terraform.io
    secrets:
      TF_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-app-release-${{ inputs.environment || github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app release with Terraform
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: ${{ inputs.environment || github.event.inputs.environment }}
      TARGET_ENV: ${{ inputs.environment || github.event.inputs.environment }}
      BACKEND_TAG: ${{ inputs.backend_tag || github.event.inputs.backend_tag }}
      WORKER_TAG: ${{ inputs.worker_tag || github.event.inputs.worker_tag }}
      FRONTEND_TAG: ${{ inputs.frontend_tag || github.event.inputs.frontend_tag }}
      PULL_POLICY: ${{ inputs.pull_policy || github.event.inputs.pull_policy }}
      TFC_ORGANIZATION: ${{ inputs.tfc_organization || github.event.inputs.tfc_organization }}
      TFC_HOSTNAME: ${{ inputs.tfc_hostname || github.event.inputs.tfc_hostname }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate release inputs
        shell: bash
        run: |
          if [[ ! "${TARGET_ENV}" =~ ^(stage|prod)$ ]]; then
            echo "Invalid environment value. Use stage or prod."
            exit 1
          fi

          if [[ -z "${BACKEND_TAG}" && -z "${WORKER_TAG}" && -z "${FRONTEND_TAG}" ]]; then
            echo "At least one of backend_tag, worker_tag, or frontend_tag must be provided."
            exit 1
          fi

          if [[ -n "${BACKEND_TAG}" && ! "${BACKEND_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid backend_tag value."
            exit 1
          fi

          if [[ -n "${WORKER_TAG}" && ! "${WORKER_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid worker_tag value."
            exit 1
          fi

          if [[ -n "${FRONTEND_TAG}" && ! "${FRONTEND_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid frontend_tag value."
            exit 1
          fi

          if [[ ! "${PULL_POLICY}" =~ ^(Always|IfNotPresent|Never)$ ]]; then
            echo "Invalid pull_policy value."
            exit 1
          fi

          if [[ -z "${TFC_ORGANIZATION}" || ! "${TFC_ORGANIZATION}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid tfc_organization value."
            exit 1
          fi

          if [[ -z "${TFC_HOSTNAME}" || ! "${TFC_HOSTNAME}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "Invalid tfc_hostname value."
            exit 1
          fi

      - name: Configure Terraform credentials
        shell: bash
        run: |
          mkdir -p "${HOME}/.terraform.d"
          cat > "${HOME}/.terraform.d/credentials.tfrc.json" <<EOF
          {
            "credentials": {
              "${TFC_HOSTNAME}": {
                "token": "${TF_API_TOKEN}"
              }
            }
          }
          EOF

      - name: Preselect Terraform workspace
        shell: bash
        run: |
          mkdir -p infra/env/.terraform
          printf '%s' "${TARGET_ENV}" > infra/env/.terraform/environment

      - name: Terraform init
        run: terraform -chdir=infra/env init -reconfigure -input=false -backend-config="organization=${TFC_ORGANIZATION}" -backend-config="hostname=${TFC_HOSTNAME}"

      - name: Prepare Terraform variable file
        shell: bash
        run: |
          auto_tfvars_path="infra/env/${TARGET_ENV}.auto.tfvars"
          cp "infra/env/environments/${TARGET_ENV}.tfvars" "${auto_tfvars_path}"

          {
            echo "image_pull_policy = \"${PULL_POLICY}\""

            if [[ -n "${BACKEND_TAG}" ]]; then
              echo "backend_image_tag = \"${BACKEND_TAG}\""
            fi

            if [[ -n "${WORKER_TAG}" ]]; then
              echo "worker_image_tag = \"${WORKER_TAG}\""
            fi

            if [[ -n "${FRONTEND_TAG}" ]]; then
              echo "frontend_image_tag = \"${FRONTEND_TAG}\""
            fi
          } >> "${auto_tfvars_path}"

      - name: Terraform apply app release
        run: terraform -chdir=infra/env apply -auto-approve -target="module.app.helm_release.app"

name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - stage
          - prod
        required: true
      backend_tag:
        description: "Backend image tag (for example sha-abcdef1234)"
        required: true
      worker_tag:
        description: "Worker image tag (for example sha-abcdef1234)"
        required: true
      pull_policy:
        description: "Kubernetes image pull policy"
        type: choice
        options:
          - IfNotPresent
          - Always
          - Never
        default: IfNotPresent
        required: true
      apply_scope:
        description: "Terraform apply scope"
        type: choice
        options:
          - app
          - full
        default: full
        required: true
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        type: string
        required: true
      backend_tag:
        description: "Backend image tag (for example sha-abcdef1234)"
        type: string
        required: true
      worker_tag:
        description: "Worker image tag (for example sha-abcdef1234)"
        type: string
        required: true
      pull_policy:
        description: "Kubernetes image pull policy"
        type: string
        required: false
        default: IfNotPresent
      apply_scope:
        description: "Terraform apply scope (app = helm_release.app target, full = whole stack)"
        type: string
        required: false
        default: full
    secrets:
      TF_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-app-release-${{ inputs.environment || github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Run Terraform apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || github.event.inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TARGET_ENV: ${{ inputs.environment || github.event.inputs.environment }}
      BACKEND_TAG: ${{ inputs.backend_tag || github.event.inputs.backend_tag }}
      WORKER_TAG: ${{ inputs.worker_tag || github.event.inputs.worker_tag }}
      PULL_POLICY: ${{ inputs.pull_policy || github.event.inputs.pull_policy }}
      APPLY_SCOPE: ${{ inputs.apply_scope || github.event.inputs.apply_scope }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate release inputs
        shell: bash
        run: |
          if [[ ! "${TARGET_ENV}" =~ ^(stage|prod)$ ]]; then
            echo "Invalid environment value. Use stage or prod."
            exit 1
          fi

          if [[ ! "${BACKEND_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid backend_tag value."
            exit 1
          fi

          if [[ ! "${WORKER_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid worker_tag value."
            exit 1
          fi

          if [[ ! "${PULL_POLICY}" =~ ^(Always|IfNotPresent|Never)$ ]]; then
            echo "Invalid pull_policy value."
            exit 1
          fi

          if [[ ! "${APPLY_SCOPE}" =~ ^(app|full)$ ]]; then
            echo "Invalid apply_scope value. Use app or full."
            exit 1
          fi

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Terraform apply
        run: |
          # Build full per-env maps so full apply keeps non-target env tags deterministic.
          backend_stage_tag="stage-latest"
          backend_prod_tag="prod-latest"
          worker_stage_tag="stage-latest"
          worker_prod_tag="prod-latest"
          pull_policy_stage="IfNotPresent"
          pull_policy_prod="IfNotPresent"

          if [[ "${TARGET_ENV}" == "stage" ]]; then
            backend_stage_tag="${BACKEND_TAG}"
            worker_stage_tag="${WORKER_TAG}"
            pull_policy_stage="${PULL_POLICY}"
          else
            backend_prod_tag="${BACKEND_TAG}"
            worker_prod_tag="${WORKER_TAG}"
            pull_policy_prod="${PULL_POLICY}"
          fi

          export TF_VAR_backend_image_tag_by_env="{\"stage\":\"${backend_stage_tag}\",\"prod\":\"${backend_prod_tag}\"}"
          export TF_VAR_worker_image_tag_by_env="{\"stage\":\"${worker_stage_tag}\",\"prod\":\"${worker_prod_tag}\"}"
          export TF_VAR_image_pull_policy_by_env="{\"stage\":\"${pull_policy_stage}\",\"prod\":\"${pull_policy_prod}\"}"

          if [[ "${APPLY_SCOPE}" == "app" ]]; then
            terraform -chdir=infra apply -auto-approve -target="helm_release.app[\"${TARGET_ENV}\"]"
          else
            terraform -chdir=infra apply -auto-approve
          fi

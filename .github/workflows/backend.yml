name: Backend Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        type: choice
        options:
          - stage
          - prod
        required: true
      tfc_organization:
        description: "HCP Terraform/Terraform Enterprise organization"
        required: false
        default: LongHuynhh
      tfc_hostname:
        description: "HCP Terraform/Terraform Enterprise hostname"
        required: false
        default: app.terraform.io
  push:
    branches:
      - stage
      - prod
    paths:
      - "backend/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

jobs:
  resolve-target-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            target_environment="${GITHUB_REF_NAME}"
          else
            target_environment="${{ inputs.environment }}"
          fi

          if [[ ! "${target_environment}" =~ ^(stage|prod)$ ]]; then
            echo "Invalid target environment: ${target_environment}"
            exit 1
          fi

          echo "target_environment=${target_environment}" >> "${GITHUB_OUTPUT}"

  build-and-push-backend:
    name: Build and Push Backend Docker Image to GHCR
    needs: resolve-target-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ needs.resolve-target-environment.outputs.target_environment }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-backend:
    name: Deploy backend to target environment
    needs:
      - resolve-target-environment
      - build-and-push-backend
    uses: ./.github/workflows/terraform-app-release.yml
    with:
      environment: ${{ needs.resolve-target-environment.outputs.target_environment }}
      backend_tag: ${{ format('sha-{0}', github.sha) }}
      pull_policy: IfNotPresent
      tfc_organization: ${{ github.event.inputs.tfc_organization || 'LongHuynhh' }}
      tfc_hostname: ${{ github.event.inputs.tfc_hostname || 'app.terraform.io' }}
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

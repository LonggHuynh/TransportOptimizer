name: Container Build and Push

on:
  workflow_call:
    inputs:
      context:
        description: "Docker build context path"
        type: string
        required: true
      dockerfile:
        description: "Dockerfile path"
        type: string
        required: true
      image_suffix:
        description: "Image suffix appended to repository name"
        type: string
        required: true
      target_environment:
        description: "Deployment environment used for latest tag"
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-${{ inputs.image_suffix }}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ inputs.target_environment }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

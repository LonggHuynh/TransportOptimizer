{{- if .Values.matrixService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "transport.matrixservice.fullname" . }}
  labels:
    {{- include "transport.labels" . | nindent 4 }}
    app.kubernetes.io/component: matrix-service
spec:
  type: {{ .Values.matrixService.service.type }}
  selector:
    {{- include "transport.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: matrix-service
  ports:
    - name: http
      port: {{ .Values.matrixService.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}

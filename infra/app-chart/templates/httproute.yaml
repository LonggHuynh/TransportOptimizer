{{- if and .Values.gateway.enabled .Values.backend.enabled .Values.frontend.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "transport.httproute.name" . }}
  labels:
    {{- include "transport.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "transport.gateway.name" . }}
      sectionName: {{ ternary "https" "http" .Values.gateway.tls.enabled | quote }}
  {{- if gt (len .Values.gateway.hostnames) 0 }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.backendPathPrefix | quote }}
      backendRefs:
        - name: {{ include "transport.backend.fullname" . }}
          port: {{ .Values.backend.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "transport.frontend.fullname" . }}
          port: {{ .Values.frontend.service.port }}
{{- if and .Values.gateway.tls.enabled .Values.gateway.httpRedirectToHttps }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-http-redirect" (include "transport.httproute.name" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "transport.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "transport.gateway.name" . }}
      sectionName: "http"
  {{- if gt (len .Values.gateway.hostnames) 0 }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: "https"
            statusCode: {{ .Values.gateway.httpRedirectStatusCode }}
{{- end }}
{{- end }}

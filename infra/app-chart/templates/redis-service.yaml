{{- if .Values.redis.enabled }}
{{- if .Values.redis.operatorManaged }}
{{- /* Service is created by the Redis operator; we only reference it by name. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "transport.redis.serviceName" . }}
  labels:
    {{- include "transport.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      protocol: TCP
{{- else if and .Values.redis.host }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "transport.redis.serviceName" . }}
  labels:
    {{- include "transport.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ include "transport.redis.serviceName" . }}
  labels:
    {{- include "transport.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
subsets:
  - addresses:
      - ip: {{ .Values.redis.host }}
    ports:
      - name: redis
        port: {{ .Values.redis.port }}
        protocol: TCP
{{- end }}
{{- end }}

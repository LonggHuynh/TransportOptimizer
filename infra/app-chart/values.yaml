nameOverride: ""
fullnameOverride: ""

commonLabels: {}

imagePullSecrets: []

imagePullSecret:
  create: false
  name: ""
  registry: "ghcr.io"
  username: ""
  password: ""

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    containerPort: 8080
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  config:
    enabled: true
    name: ""
    existingName: ""
    data: {}
  secret:
    enabled: false
    name: ""
    existingName: ""
    data: {}
  secretsStore:
    enabled: false
    providerClass: ""
    mountPath: "/var/secrets"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  config:
    enabled: true
    name: ""
    existingName: ""
    data: {}
  secret:
    enabled: false
    name: ""
    existingName: ""
    data: {}
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

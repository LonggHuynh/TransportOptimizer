nameOverride: ""
fullnameOverride: ""

commonLabels: {}

imagePullSecrets: []

imagePullSecret:
  create: false
  name: ""
  registry: "ghcr.io"
  username: ""
  password: ""

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: "ghcr.io/longhuynh5713/pathplanner-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    containerPort: 8080
  health:
    path: "/healthz"
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  config:
    enabled: true
    name: ""
    existingName: ""
    data: {}
  secret:
    enabled: false
    name: ""
    existingName: ""
    data: {}
  secretsStore:
    enabled: false
    providerClass: ""
    mountPath: "/var/secrets"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/longhuynh5713/pathplanner-worker"
    tag: "latest"
    pullPolicy: IfNotPresent
  health:
    path: "/healthz"
    port: 8081
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  config:
    enabled: true
    name: ""
    existingName: ""
    data: {}
  secret:
    enabled: false
    name: ""
    existingName: ""
    data: {}
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: "ghcr.io/longhuynh5713/pathplanner-frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    containerPort: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

gateway:
  enabled: true
  className: "gke-l7-global-external-managed"
  backendPathPrefix: "/api"
  hostnames: []
  backendHealthCheckPolicy:
    enabled: true
    name: "backend-healthz"
    requestPath: "/healthz"

redis:
  enabled: false
  serviceName: ""
  host: ""
  port: 6379
  operatorManaged: false
  clusterSize: 3
  replicas: 1
  persistenceEnabled: true
  storageSize: "1Gi"
  storageClassName: ""
  exporterEnabled: true
  exporterImage: "quay.io/opstree/redis-exporter"
  exporterImageTag: "v1.44.0"
  image: "quay.io/opstree/redis"
  imageTag: "v7.0.15"
  imagePullPolicy: "IfNotPresent"
  config: {}
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

redisOperator:
  enabled: false

authService:
  enabled: true
  replicaCount: 2
  image:
    repository: "ghcr.io/longhuynh5713/pathplanner-auth-service"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    containerPort: 8083
  health:
    path: "/healthz"
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  config:
    enabled: true
    name: ""
    existingName: ""
    data: {}
  secret:
    enabled: false
    name: ""
    existingName: ""
    data: {}
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
